services:
  - type: web
    name: kanha-backend
    env: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.db.seeds
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kanha-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash:free
      - key: ENVIRONMENT
        value: production

databases:
  - name: kanha-db
    plan: free
